# Infrastructure for the integration / concurrency suites (the tests run on the host with `bun test`).
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: wagering_test }
    ports: ["5432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    command: ["postgres", "-c", "max_connections=300", "-c", "fsync=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  localstack:
    image: localstack/localstack:3
    environment: { SERVICES: sqs }
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues"]
      interval: 2s
      timeout: 5s
      retries: 30
